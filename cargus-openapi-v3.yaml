  /api/AwbDocuments:
    get:
      tags:
        - AwbDocuments
      summary: Print awb labels
      description: Print awb labels
      operationId: AwbDocuments_Get
      parameters:
        - name: barCodes
          in: query
          description: ''
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: 'PDF, HTML or ZPL'
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: 0 - A4; 1 - Label 10x14; 2 - ZPL 300DPI
          schema:
            enum:
              - 0
              - 1
              - 2
            type: integer
            format: int32
        - name: printMainOnce
          in: query
          description: 0 or nothing - Main AWB will print twice; 1 - Main AWB will print once
          schema:
            type: integer
            format: int32
        - name: printOneAwbPerPage
          in: query
          description: 0 or nothing - two AWBs will be print on page; 1 - single AWB will be print on page
          schema:
            type: integer
            format: int32
        - name: senderName
          in: query
          description: null - display client and pickupLocation name; String - display senderName
          schema:
            type: string
        - name: printReturn
          in: query
          description: 0 - Do not print return; 1 - Print return awb 2 - Print return awb with instructions 3 - Print only return awb
          schema:
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
            type: integer
            format: int32
        - name: Authorization
          in: header
          description: access token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet200ApplicationJsonResponse'
              example: string
            text/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet200TextJsonResponse'
              example: string
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet200ApplicationXmlResponse'
