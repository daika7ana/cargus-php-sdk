      tags:
        - AwbDocuments
      summary: Print DHL awb labels
      description: Print DHL awb labels
      operationId: AwbDocuments_GetDHL
      parameters:
        - name: barCodes
          in: query
          description: ''
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: PDF or HTML
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: 0 - A4; 1 - Label 10x14
          schema:
            enum:
              - 0
              - 1
              - 2
            type: integer
            format: int32
        - name: printMainOnce
          in: query
          description: 0 or nothing - Main AWB will print twice; 1 - Main AWB will print once
          schema:
            type: integer
            format: int32
        - name: printOneAwbPerPage
          in: query
          description: 0 or nothing - two AWBs will be print on page; 1 - single AWB will be print on page
          schema:
            type: integer
            format: int32
        - name: senderName
          in: query
          description: null - display client and pickupLocation name; String - display senderName
          schema:
            type: string
        - name: Authorization
          in: header
          description: access token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGetDHLGet200ApplicationJsonResponse'
              example: string
            text/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGetDHLGet200TextJsonResponse'
              example: string
            application/xml:
