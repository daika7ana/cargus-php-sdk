            text/xml:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet200TextXmlResponse'
              example: <ApiAwbDocumentsGet200TextXmlResponse>string</ApiAwbDocumentsGet200TextXmlResponse>
        '204':
          description: No content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet204ApplicationJsonResponse'
              example: string
            text/json:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet204TextJsonResponse'
              example: string
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet204ApplicationXmlResponse'
              example: <ApiAwbDocumentsGet204ApplicationXmlResponse>string</ApiAwbDocumentsGet204ApplicationXmlResponse>
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiAwbDocumentsGet204TextXmlResponse'
              example: <ApiAwbDocumentsGet204TextXmlResponse>string</ApiAwbDocumentsGet204TextXmlResponse>
        '400':
          description: Bad request
          content:
            application/json: { }
            text/json: { }
            application/xml: { }
            text/xml: { }
        '401':
          description: Not Authorized
